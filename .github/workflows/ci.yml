name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # The floor the gemspec declares, then every line upstream still
        # supports. 3.2 is covered by the 3.1 entry: nothing here is version
        # sensitive, and the floor is the only edge worth a job of its own.
        ruby: ['3.1', '3.3', '3.4', '4.0']
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - run: bundle exec rake test
